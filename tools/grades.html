<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحليل وتقييم الأداء التعليمي والدرجات (EduGrades AI) | منصة المعلمات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #070a12; color: #f3f4f6; }
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%); }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-3d {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            box-shadow: 0 4px 0 #1e40af, 0 8px 20px rgba(79, 70, 229, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-3d:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1e40af, 0 12px 25px rgba(79, 70, 229, 0.6); }
        .btn-3d:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e40af; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950/80 backdrop-blur-xl border-b border-white/10 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center space-x-3 space-x-reverse text-slate-300 hover:text-cyan-400 transition font-bold text-sm">
                <i class="fa-solid fa-arrow-right text-base"></i>
                <span data-i18n="backToHome">العودة للرئيسية</span>
            </a>
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-xl gradient-bg flex items-center justify-center text-white text-base shadow-lg">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <span class="font-extrabold text-white text-base">نظام تقييم وتحليل الأداء والدرجات (EduGrades AI)</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 w-full">
        
        <!-- Input & Configuration Side -->
        <div class="lg:col-span-5 glass-card p-6 rounded-3xl flex flex-col space-y-5 border border-white/10">
            <h2 class="text-lg font-extrabold text-white border-b border-white/10 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-file-excel text-cyan-400"></i> إدخال درجات الطالبات واستيراد البيانات
            </h2>

            <!-- Student Data Entry Options -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">اسم المادة / الاختبار</label>
                <input type="text" id="subjectTitle" placeholder="مثال: اختبار الفترات - لغتي / العلوم" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
            </div>

            <!-- Grade Scale / Max Marks -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2">الدرجة الكلية (القصوى)</label>
                    <input type="number" id="maxGrade" value="100" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-2">درجة النجاح / التجاوز</label>
                    <input type="number" id="passGrade" value="50" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <!-- Student Names & Grades Textarea -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">قائمة الطالبات والدرجات (اسم الطالبة : الدرجة)</label>
                <textarea id="gradesListInput" rows="6" placeholder="مثال:
سارة أحمد : 95
نورة خالد : 88
ريم علي : 42
منى حسن : 75" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-cyan-400 leading-relaxed font-sans"></textarea>
            </div>

            <button onclick="analyzeEduGrades()" class="btn-3d w-full py-3.5 rounded-2xl text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-chart-line"></i>
                <span>تحليل الأداء واستخراج المؤشرات والرسوم 📊</span>
            </button>
        </div>

        <!-- Analytics Output & Visual Dashboard -->
        <div class="lg:col-span-7 flex flex-col space-y-4">
            <div class="glass-card p-6 rounded-3xl border border-white/10 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                    <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                        <i class="fa-solid fa-square-poll-vertical text-cyan-400"></i> لوحة التحليل الإحصائي والتوصيات التربوية
                    </h3>
                </div>

                <!-- Summary Indicators -->
                <div id="statsSummaryBar" class="hidden grid grid-cols-3 gap-3 mb-4">
                    <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl text-center">
                        <span class="text-[11px] text-slate-400 block font-bold">متوسط الفصل</span>
                        <span id="avgMark" class="text-lg font-black text-cyan-400">0</span>
                    </div>
                    <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl text-center">
                        <span class="text-[11px] text-slate-400 block font-bold">نسبة التجاوز</span>
                        <span id="passRate" class="text-lg font-black text-emerald-400">0%</span>
                    </div>
                    <div class="bg-slate-900/90 border border-slate-800 p-3 rounded-2xl text-center">
                        <span class="text-[11px] text-slate-400 block font-bold">عدد الطالبات</span>
                        <span id="totalStudents" class="text-lg font-black text-indigo-400">0</span>
                    </div>
                </div>

                <!-- Chart Canvas -->
                <div id="chartContainer" class="hidden bg-slate-900/50 rounded-2xl p-4 border border-slate-800 mb-4 h-56 flex items-center justify-center">
                    <canvas id="gradesChart"></canvas>
                </div>

                <!-- Recommendations Container -->
                <div id="gradesOutput" class="flex-1 text-slate-400 text-xs flex items-center justify-center">
                    <div class="text-center py-16">
                        <i class="fa-solid fa-chart-simple text-5xl mb-3 text-slate-700"></i>
                        <p class="font-bold text-slate-400">أدخلي درجات الطالبات واضغطي على "تحليل الأداء" لعرض الرسوم البيانية والتوصيات.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let myChart = null;

        function analyzeEduGrades() {
            const rawText = document.getElementById('gradesListInput').value.trim();
            const maxGrade = parseFloat(document.getElementById('maxGrade').value) || 100;
            const passGrade = parseFloat(document.getElementById('passGrade').value) || 50;
            const output = document.getElementById('gradesOutput');
            const statsBar = document.getElementById('statsSummaryBar');
            const chartBox = document.getElementById('chartContainer');

            if (!rawText) {
                showToast("يرجى إدخال درجات الطالبات أولاً!");
                return;
            }

            const lines = rawText.split('\n');
            const students = [];
            let total = 0;
            let passedCount = 0;

            lines.forEach(line => {
                const parts = line.split(/[:=,]/);
                if (parts.length >= 2) {
                    const name = parts[0].trim();
                    const mark = parseFloat(parts[1].trim());
                    if (!isNaN(mark)) {
                        students.push({ name, mark });
                        total += mark;
                        if (mark >= passGrade) passedCount++;
                    }
                }
            });

            if (!students.length) {
                showToast("لم يتم التعرف على الدرجات بصيغة صحيحة! استخدمي الصيغة: اسم الطالبة : الدرجة");
                return;
            }

            const count = students.length;
            const avg = (total / count).toFixed(1);
            const passPct = Math.round((passedCount / count) * 100);

            // Display Summary Bar
            document.getElementById('avgMark').innerText = avg + ' / ' + maxGrade;
            document.getElementById('passRate').innerText = passPct + '%';
            document.getElementById('totalStudents').innerText = count;
            statsBar.classList.remove('hidden');
            chartBox.classList.remove('hidden');

            // Render Chart
            renderChart(students, passGrade);

            // Render Report
            let reportHTML = `
                <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl text-slate-200 space-y-3 w-full">
                    <h4 class="font-extrabold text-sm text-cyan-400 border-b border-slate-800 pb-2">📋 التوصيات والخطط العلاجية المقترحة للأداء:</h4>
                    <ul class="list-disc pr-4 space-y-1.5 text-xs text-slate-300">
                        <li><strong>المستوى العام للفصل:</strong> متوسط الدرجات هو (${avg}) ونسبة النجاح (${passPct}%).</li>
            `;

            if (passPct >= 85) {
                reportHTML += `<li class="text-emerald-400">🌟 **أداء ممتاز!** ينصح بتعزيز الطالبات المتميزات بأنشطة إثرائية ومهارات التفكير العليا.</li>`;
            } else if (passPct >= 60) {
                reportHTML += `<li class="text-amber-400">⚠️ **أداء متوسط:** ينصح بتقديم مراجعات مركزة للأسئلة الشائعة وتفعيل التعلم بالقرين.</li>`;
            } else {
                reportHTML += `<li class="text-red-400">🚨 **يحتاج دعم وترميم:** ينصح بإعادة شرح المفاهيم الأساسية وتطبيق خطة علاجية فردية.</li>`;
            }

            reportHTML += `</ul></div>`;
            output.innerHTML = reportHTML;
            showToast("تم تحليل الأداء وإنشاء المخطط بنجاح!");
        }

        function renderChart(students, passGrade) {
            const ctx = document.getElementById('gradesChart').getContext('2d');
            if (myChart) myChart.destroy();

            const labels = students.map(s => s.name);
            const data = students.map(s => s.mark);
            const bgColors = data.map(m => m >= passGrade ? 'rgba(6, 182, 212, 0.7)' : 'rgba(239, 68, 68, 0.7)');

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'درجة الطالبة',
                        data: data,
                        backgroundColor: bgColors,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }
    </script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/i18n-tools.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
