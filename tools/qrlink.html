<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد ومحول الروابط ورامز الاستجابة (EduQR Link) | منصة المعلمات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #070a12; color: #f3f4f6; }
        .gradient-bg { background: linear-gradient(135deg, #059669 0%, #8b5cf6 100%); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950/80 backdrop-blur-xl border-b border-white/10 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center space-x-3 space-x-reverse text-slate-300 hover:text-emerald-400 transition font-bold">
                <i class="fa-solid fa-arrow-right text-lg"></i>
                <span>العودة للرئيسية</span>
            </a>
            <div class="flex items-center space-x-2 space-x-reverse">
                <div class="w-8 h-8 rounded-lg gradient-bg flex items-center justify-center text-white text-sm">
                    <i class="fa-solid fa-qrcode"></i>
                </div>
                <span class="font-bold text-white">صانع ومحول الروابط لـ باركود QR التفاعلي</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 w-full">
        
        <!-- Form Section -->
        <div class="lg:col-span-5 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col space-y-5">
            <h2 class="text-xl font-bold text-slate-900 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-link text-emerald-600"></i> بيانات الرمز والملف
            </h2>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">نوع المحتوى المراد تحويله</label>
                <select id="qrType" onchange="toggleInputs()" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                    <option value="url">🔗 رابط موقع أو درس تفاعلي</option>
                    <option value="drive">📁 رابط ملف من Google Drive / Canva</option>
                    <option value="text">📝 نص، سؤال، أو رسالة ترحيبية</option>
                </select>
            </div>

            <div id="urlInputContainer">
                <label class="block text-sm font-bold text-slate-700 mb-2">الرابط أو المحتوى</label>
                <input type="text" id="qrInput" placeholder="ضع الرابط هنا (مثال: https://drive.google.com/...)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">عنوان أو اسم الرمز (للطباعة على أوراق العمل)</label>
                <input type="text" id="qrTitle" placeholder="مثال: باركود العرض التقديمي للدرس" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">لون الرمز</label>
                    <input type="color" id="qrColor" value="#059669" class="w-full h-11 p-1 rounded-xl border border-slate-200 cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">حجم الرمز</label>
                    <select id="qrSize" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-sm">
                        <option value="180">متوسط (أوراق العمل)</option>
                        <option value="250">كبير (العروض واللوحات)</option>
                    </select>
                </div>
            </div>

            <button onclick="generateQRCode()" class="w-full py-3.5 rounded-xl text-white font-bold gradient-bg shadow-md hover:shadow-lg transition">
                إنشاء رمز QR الآن 📱
            </button>
        </div>

        <!-- Output Result Section -->
        <div class="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between items-center text-center">
            <div class="w-full">
                <div class="flex justify-between items-center border-b pb-3 mb-6">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-qrcode text-emerald-600"></i> الرمز المولد
                    </h2>
                </div>

                <div id="qrResult" class="flex flex-col items-center justify-center p-8 border-2 border-dashed border-emerald-100 rounded-3xl bg-emerald-50/30 min-h-[300px]">
                    <i class="fa-solid fa-qrcode text-6xl text-slate-300 mb-4"></i>
                    <p class="text-slate-500 text-sm">أدخلي الرابط أو النص ثم اضغطي على "إنشاء رمز QR الآن".</p>
                </div>
            </div>
        </div>

    </main>

    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/i18n-tools.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        function generateQRCode() {
            const inputVal = document.getElementById('qrInput').value.trim() || 'https://teachershub.app';
            const titleVal = document.getElementById('qrTitle').value.trim() || 'رمز استجابة سريع';
            const colorVal = document.getElementById('qrColor').value;
            const sizeVal = parseInt(document.getElementById('qrSize').value);

            const container = document.getElementById('qrResult');
            container.innerHTML = `
                <h3 class="font-bold text-slate-900 text-lg mb-4">${titleVal}</h3>
                <div id="qrcodeCanvas" class="p-4 bg-white rounded-2xl shadow-md border border-slate-100 inline-block mb-6"></div>
                <div class="flex gap-3 justify-center">
                    <button onclick="downloadQR()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 transition flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> تنزيل الرمز (PNG)
                    </button>
                </div>
            `;

            new QRCode(document.getElementById("qrcodeCanvas"), {
                text: inputVal,
                width: sizeVal,
                height: sizeVal,
                colorDark : colorVal,
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcodeCanvas img');
            if (img) {
                const link = document.createElement('a');
                link.href = img.src;
                link.download = 'QR_TeachersHub.png';
                link.click();
            } else {
                alert('يرجى إنشاء الرمز أولاً');
            }
        }
    </script>
</body>
</html>
