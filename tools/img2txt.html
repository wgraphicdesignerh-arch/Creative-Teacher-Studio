<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة استخراج النص من الصور OCR (EduImg2Txt) | منصة المعلمات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #070a12; color: #f3f4f6; }
        .gradient-bg { background: linear-gradient(135deg, #0284c7 0%, #8b5cf6 100%); }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .drop-zone { border: 2px dashed rgba(59, 130, 246, 0.5); transition: all 0.3s ease; }
        .drop-zone:hover { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .btn-3d {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            box-shadow: 0 4px 0 #1e40af, 0 8px 20px rgba(2, 132, 199, 0.4);
            transition: all 0.15s ease-in-out;
        }
        .btn-3d:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #1e40af, 0 12px 25px rgba(2, 132, 199, 0.6); }
        .btn-3d:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e40af; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-950/80 backdrop-blur-xl border-b border-white/10 py-4 px-6 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="../index.html" class="flex items-center space-x-3 space-x-reverse text-slate-300 hover:text-sky-400 transition font-bold text-sm">
                <i class="fa-solid fa-arrow-right text-base"></i>
                <span data-i18n="backToHome">العودة للرئيسية</span>
            </a>
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="w-9 h-9 rounded-xl gradient-bg flex items-center justify-center text-white text-base shadow-lg">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <span class="font-extrabold text-white text-base">مستخرج النصوص المتقدم من الصور (EduImg2Txt OCR)</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 flex-1 w-full">
        
        <!-- Upload & OCR Options -->
        <div class="lg:col-span-5 glass-card p-6 rounded-3xl flex flex-col space-y-5 border border-white/10">
            <h2 class="text-lg font-extrabold text-white border-b border-white/10 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-image text-sky-400"></i> رفع الصورة وإعدادات التعرف الضوئي
            </h2>

            <!-- Drop Zone -->
            <div class="drop-zone rounded-2xl p-8 text-center cursor-pointer flex flex-col items-center justify-center min-h-[220px]" onclick="document.getElementById('imageInput').click()">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-sky-400 mb-3"></i>
                <p class="font-bold text-sm text-white mb-1">اسحبي صورة أوراق العمل أو الكتُب هنا</p>
                <p class="text-xs text-slate-400">أو اضغطي لاختيار صورة من جهازك (PNG, JPG, WEBP)</p>
                <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            </div>

            <!-- Preview Image -->
            <div id="imagePreviewContainer" class="hidden relative rounded-2xl overflow-hidden border border-slate-700 bg-slate-900 max-h-[200px] flex items-center justify-center">
                <img id="imagePreview" class="max-h-[190px] object-contain">
            </div>

            <!-- Language Select for OCR -->
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">لغة النص في الصورة</label>
                <select id="ocrLang" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-400">
                    <option value="ara" selected>العربية (Arabic OCR)</option>
                    <option value="eng">الإنجليزية (English OCR)</option>
                    <option value="fra">الفرنسية (French OCR)</option>
                    <option value="ara+eng">عربي + إنجليزي (Bilingual Multi-OCR)</option>
                </select>
            </div>

            <button onclick="processOCR()" id="ocrBtn" class="btn-3d w-full py-3.5 rounded-2xl text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer mt-2" disabled>
                <i class="fa-solid fa-file-export"></i>
                <span>استخراج النص من الصورة الآن ⚡</span>
            </button>
        </div>

        <!-- Result Text Area -->
        <div class="lg:col-span-7 flex flex-col space-y-4">
            <div class="glass-card p-6 rounded-3xl border border-white/10 flex-1 flex flex-col">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-white/10">
                    <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                        <i class="fa-solid fa-align-left text-sky-400"></i> النص المستخرج المباشر (Extracted Text)
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="copyExtractedText()" class="px-3 py-1.5 rounded-lg bg-sky-500/20 text-sky-300 hover:bg-sky-500/30 text-xs font-bold transition flex items-center gap-1">
                            <i class="fa-solid fa-copy"></i>
                            <span>نسخ النص</span>
                        </button>
                    </div>
                </div>

                <div id="ocrProgress" class="hidden mb-4 bg-slate-900 rounded-xl p-3 border border-slate-800">
                    <div class="flex justify-between text-xs font-bold text-sky-400 mb-1">
                        <span>جاري قراءة واستخراج الحروف والكلمات...</span>
                        <span id="ocrPercent">0%</span>
                    </div>
                    <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div id="ocrProgressBar" class="bg-sky-500 h-full w-0 transition-all duration-200"></div>
                    </div>
                </div>

                <textarea id="extractedOutput" rows="14" placeholder="سيظهر النص المستخرج هنا تلقائياً بعد رفع الصورة والضغط على زر الاستخراج..." class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-4 text-xs text-slate-100 focus:outline-none focus:border-sky-400 leading-relaxed font-sans flex-1 resize-none"></textarea>
            </div>
        </div>
    </main>

    <script>
        let selectedFile = null;

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedFile = file;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
                document.getElementById('ocrBtn').disabled = false;
            };
            reader.readAsDataURL(file);
        }

        async function processOCR() {
            if (!selectedFile) return;

            const btn = document.getElementById('ocrBtn');
            const lang = document.getElementById('ocrLang').value;
            const progressBox = document.getElementById('ocrProgress');
            const percentText = document.getElementById('ocrPercent');
            const progressBar = document.getElementById('ocrProgressBar');
            const outputArea = document.getElementById('extractedOutput');

            btn.disabled = true;
            progressBox.classList.remove('hidden');
            outputArea.value = "جاري قراءة النص وتحليله بواسطة محرك Tesseract OCR...";

            try {
                const worker = await Tesseract.createWorker(lang, 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            const pct = Math.round(m.progress * 100);
                            percentText.innerText = pct + '%';
                            progressBar.style.width = pct + '%';
                        }
                    }
                });

                const ret = await worker.recognize(selectedFile);
                outputArea.value = ret.data.text || "لم يتم العثور على نص واضح في هذه الصورة. يرجى رفع صورة أكثر وضوحاً.";
                await worker.terminate();
                showToast("تم استخراج النص بنجاح!");
            } catch (err) {
                outputArea.value = "حدث خطأ أثناء استخراج النص: " + err.message;
            } finally {
                btn.disabled = false;
                progressBox.classList.add('hidden');
            }
        }

        function copyExtractedText() {
            const text = document.getElementById('extractedOutput').value;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast("تم نسخ النص المستخرج بنجاح!");
            });
        }
    </script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/i18n-tools.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
